[package]
name = "molt"
version = "0.1.0"
description = "A macOS menu bar Python notebook scratchpad"
authors = []
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "molt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
libc = "0.2"
window-vibrancy = "0.6"
