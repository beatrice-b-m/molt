name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
          tauriScript: bunx tauri

      - name: Prepare artifacts
        id: artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          # .dmg is the primary macOS installer
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          # .app.tar.gz is the updater-compatible archive
          TARGZ=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' -type f | head -1)

          ARTIFACTS=""

          if [ -n "$DMG" ]; then
            DEST_DMG="Molt_${VERSION}_${{ matrix.arch }}.dmg"
            cp "$DMG" "$DEST_DMG"
            ARTIFACTS="$DEST_DMG"
          fi

          if [ -n "$TARGZ" ]; then
            DEST_TARGZ="Molt_${VERSION}_${{ matrix.arch }}.app.tar.gz"
            cp "$TARGZ" "$DEST_TARGZ"
            ARTIFACTS="$ARTIFACTS $DEST_TARGZ"
          fi

          echo "files=$ARTIFACTS" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in ${{ steps.artifacts.outputs.files }}; do
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done
