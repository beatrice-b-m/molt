name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.1 --locked

      - name: Build Tauri app
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cargo tauri build --target ${{ matrix.target }} --config "{\"version\":\"${RELEASE_TAG#v}\"}"

      - name: Upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/"$BUILD_TARGET"/release/bundle/dmg/*.dmg)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG installer" >&2
            exit 1
          fi
          destination="Molt_${RELEASE_TAG#v}_${BUILD_ARCH}.dmg"
          cp "${installers[0]}" "$destination"
          gh release upload "$RELEASE_TAG" "$destination" --clobber
